{% extends "novels/base.html" %}

{% block title %}Text-to-Speech: {{ title }}{% endblock %}

{% block content %}
<div style="text-align:center;">
<h1>Text-to-Speech</h1>
<h2>{{ title }}</h2>
<p class="meta">First 3,000 characters converted by AWS Polly to MP3.</p>

<form class="tts-form" method="post" action="{% url 'novel_tts' s3_key %}" style="margin:0 auto;">
    {% csrf_token %}
    <label for="voice_id">Choose a voice:</label>
    <select name="voice_id" id="voice_id">
        <option value="Joanna">Joanna - US Female Neural</option>
        <option value="Matthew">Matthew - US Male Neural</option>
        <option value="Amy">Amy - British Female Neural</option>
        <option value="Brian">Brian - British Male Neural</option>
    </select>
    <button type="submit">Generate MP3</button>
</form>

<div class="action-links" style="margin-top:24px;">
    <a class="btn btn-primary" href="{% url 'novel_detail' s3_key %}">Back to Novel</a>
    <a class="btn btn-primary" href="{% url 'novel_list' %}">Back to List</a>
</div>
</div>
{% endblock %}
